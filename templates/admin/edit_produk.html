<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Produk - Admin</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="d-flex justify-content-between mb-4">

                <div>

                    <h2>
                        Edit Produk
                    </h2>

                    <p class="text-muted">
                        ID Produk: {{ produk.id }}
                    </p>

                </div>

                <a
                    href="{{ url_for('admin_produk') }}"
                    class="btn btn-secondary"
                >
                    Kembali
                </a>

            </div>


            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <form
                        method="POST"
                        action="{{ url_for('admin_edit_produk', id=produk.id) }}"
                    >

                        <div class="mb-3">

                            <label class="form-label">
                                Nama Produk
                            </label>

                            <input
                                type="text"
                                name="nama"
                                class="form-control"
                                value="{{ produk.nama }}"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Kategori
                            </label>

                            <input
                                type="text"
                                name="kategori"
                                class="form-control"
                                value="{{ produk.kategori }}"
                                required
                            >

                        </div>


                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Harga
                                </label>

                                <input
                                    type="number"
                                    name="harga"
                                    class="form-control"
                                    value="{{ produk.harga }}"
                                    min="0"
                                    required
                                >

                            </div>


                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Stok
                                </label>

                                <input
                                    type="number"
                                    name="stok"
                                    class="form-control"
                                    value="{{ produk.stok }}"
                                    min="0"
                                    required
                                >

                            </div>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Folder Gambar
                            </label>

                            <input
                                type="text"
                                name="folder"
                                class="form-control"
                                value="{{ produk.folder }}"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Deskripsi
                            </label>

                            <textarea
                                name="deskripsi"
                                class="form-control"
                                rows="5"
                            >{{ produk.deskripsi or '' }}</textarea>

                        </div>


                        <div class="mb-4">

                            <label class="form-label">
                                Ukuran Produk
                            </label>

                            {% set ukuran_tersedia = [] %}

                            {% for ukuran in produk.ukuran_produk %}

                                {% set _ = ukuran_tersedia.append(ukuran.ukuran) %}

                            {% endfor %}


                            <div class="row">

                                {% for size in ["S", "M", "L", "XL"] %}

                                    <div class="col-md-3">

                                        <div class="form-check">

                                            <input
                                                class="form-check-input"
                                                type="checkbox"
                                                name="ukuran"
                                                value="{{ size }}"
                                                id="ukuran{{ size }}"
                                                {% if size in ukuran_tersedia %}checked{% endif %}
                                            >

                                            <label
                                                class="form-check-label"
                                                for="ukuran{{ size }}"
                                            >
                                                {{ size }}
                                            </label>

                                        </div>

                                    </div>

                                {% endfor %}

                            </div>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-dark w-100"
                        >
                            Simpan Perubahan
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
