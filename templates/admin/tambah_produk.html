<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Tambah Produk - Admin</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="d-flex justify-content-between mb-4">

                <div>

                    <h2>
                        Tambah Produk
                    </h2>

                    <p class="text-muted">
                        Tambahkan produk baru
                    </p>

                </div>

                <a
                    href="{{ url_for('admin_produk') }}"
                    class="btn btn-secondary"
                >
                    Kembali
                </a>

            </div>


            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <form
                        method="POST"
                        action="{{ url_for('admin_tambah_produk') }}"
                    >

                        <div class="mb-3">

                            <label class="form-label">
                                Nama Produk
                            </label>

                            <input
                                type="text"
                                name="nama"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Kategori
                            </label>

                            <input
                                type="text"
                                name="kategori"
                                class="form-control"
                                placeholder="Contoh: T-Shirt"
                                required
                            >

                        </div>


                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Harga
                                </label>

                                <input
                                    type="number"
                                    name="harga"
                                    class="form-control"
                                    min="0"
                                    required
                                >

                            </div>


                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Stok
                                </label>

                                <input
                                    type="number"
                                    name="stok"
                                    class="form-control"
                                    min="0"
                                    required
                                >

                            </div>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Folder Gambar
                            </label>

                            <input
                                type="text"
                                name="folder"
                                class="form-control"
                                placeholder="Contoh: product1"
                                required
                            >

                            <small class="text-muted">
                                Isi sesuai struktur folder gambar produk kamu.
                            </small>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Deskripsi
                            </label>

                            <textarea
                                name="deskripsi"
                                class="form-control"
                                rows="5"
                            ></textarea>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Ukuran Produk
                            </label>

                            <div class="row">

                                <div class="col-md-3">
                                    <div class="form-check">
                                        <input
                                            class="form-check-input"
                                            type="checkbox"
                                            name="ukuran"
                                            value="S"
                                            id="ukuranS"
                                        >
                                        <label
                                            class="form-check-label"
                                            for="ukuranS"
                                        >
                                            S
                                        </label>
                                    </div>
                                </div>


                                <div class="col-md-3">
                                    <div class="form-check">
                                        <input
                                            class="form-check-input"
                                            type="checkbox"
                                            name="ukuran"
                                            value="M"
                                            id="ukuranM"
                                        >
                                        <label
                                            class="form-check-label"
                                            for="ukuranM"
                                        >
                                            M
                                        </label>
                                    </div>
                                </div>


                                <div class="col-md-3">
                                    <div class="form-check">
                                        <input
                                            class="form-check-input"
                                            type="checkbox"
                                            name="ukuran"
                                            value="L"
                                            id="ukuranL"
                                        >
                                        <label
                                            class="form-check-label"
                                            for="ukuranL"
                                        >
                                            L
                                        </label>
                                    </div>
                                </div>


                                <div class="col-md-3">
                                    <div class="form-check">
                                        <input
                                            class="form-check-input"
                                            type="checkbox"
                                            name="ukuran"
                                            value="XL"
                                            id="ukuranXL"
                                        >
                                        <label
                                            class="form-check-label"
                                            for="ukuranXL"
                                        >
                                            XL
                                        </label>
                                    </div>
                                </div>

                            </div>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-dark w-100"
                        >
                            Simpan Produk
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
